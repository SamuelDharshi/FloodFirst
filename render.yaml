# Render Blueprint: New -> Blueprint -> pick this repo. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: floodfirst-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # public settings
      - key: EXPECTED_CHAIN_ID
        value: "84532"
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: CORS_ORIGINS
        value: https://floodfirst.vercel.app
      - key: GAUGE_MODE
        value: operator
      - key: GAUGE_SCALE
        value: "100"
      - key: BASIN_LAT
        value: "26.19"
      - key: BASIN_LON
        value: "91.70"
      - key: ORACLE_ENABLED
        value: "false"
      - key: CONFIRMATIONS
        value: "5"
      - key: INDEXER_CHUNK
        value: "200"
      - key: LOG_LEVEL
        value: info
      # secrets: use throwaway TESTNET keys only. Do NOT add the deployer/owner key here.
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: VOUCHER_SIGNER_PRIVATE_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      # optional: only needed to run the trigger from the server (ORACLE_ENABLED=true) or call oracle:once
      - key: FORECAST_ATTESTER_PRIVATE_KEY
        sync: false
      - key: GAUGE_ATTESTER_PRIVATE_KEY
        sync: false
      - key: FALLBACK_ATTESTER_PRIVATE_KEY
        sync: false
