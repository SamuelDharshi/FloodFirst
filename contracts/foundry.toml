[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "../deployments" }]
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@semaphore-protocol/=node_modules/@semaphore-protocol/",
    "@zk-kit/=node_modules/@zk-kit/",
    "poseidon-solidity/=node_modules/poseidon-solidity/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 32

[profile.e2e]
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "../deployments" }, { access = "read-write", path = "../services/test/.tmp" }]
